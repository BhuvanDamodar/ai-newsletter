name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
      - 'phase-*'
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Lint, Test & Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_ainews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest Suite (SQLite + PostgreSQL/pgvector)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_ainews
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_ainews
          LLM_API_KEY: "dummy_ci_key"
        run: |
          pytest tests/ -v --tb=short

      - name: Validate Backend Docker Build
        run: |
          docker build -t briefly-backend:ci .

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: "https://ai-newsletter-ejym.onrender.com"
        run: npm run build
